
name: AUTHER Launcher V0.1 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -not -path './.gradle/*' -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            echo "Pastikan settings.gradle ada di root project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project ditemukan: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTHER-Launcher-V0.1
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
